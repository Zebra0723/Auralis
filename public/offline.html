<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — Auralis</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f8f9fb;
        color: #171a24;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        text-align: center;
        padding: 24px;
      }
      h1 { font-size: 20px; font-weight: 500; letter-spacing: -0.015em; margin: 20px 0 8px; }
      p { font-size: 14px; line-height: 1.6; color: #545a6b; margin: 0; max-width: 34ch; }
    </style>
  </head>
  <body>
    <div>
      <svg width="40" height="40" viewBox="0 0 32 32" fill="none" aria-hidden="true">
        <defs>
          <linearGradient id="g" x1="4" y1="28" x2="28" y2="6" gradientUnits="userSpaceOnUse">
            <stop stop-color="#2f6be4" />
            <stop offset="1" stop-color="#7a4fd4" />
          </linearGradient>
        </defs>
        <path d="M5 27 L15 6 Q16 4 17 6 L27 27" stroke="url(#g)" stroke-width="3.6"
              stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      <h1>You are offline</h1>
      <p>
        Auralis needs a connection to show what your services are doing. Syncing
        continues in the background regardless — nothing is lost.
      </p>
    </div>
  </body>
</html>
