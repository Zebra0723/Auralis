name: CI

# Deployment is handled by Vercel's Git integration, which builds and deploys
# on its own when a commit lands. This workflow only checks the code, so a
# broken commit is visible on the pull request rather than only in Vercel's
# build log.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # postinstall runs prisma generate, so the client exists before typecheck.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # Runs with no environment variables on purpose: the build must not
      # require a database or any provider credentials. If this step starts
      # needing them, Vercel's build would break too.
      - name: Build
        run: npx next build
